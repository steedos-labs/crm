name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  metadata-test:
    name: 元数据基础校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 运行元数据测试
        run: node scripts/test-metadata.js
